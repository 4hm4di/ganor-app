<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 24 24" fill="none"><style>@keyframes in{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}@keyframes draw{from{stroke-dashoffset:1;opacity:0}1%{opacity:1}to{stroke-dashoffset:0;opacity:1}}@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.3)}100%{transform:scale(1)}}@keyframes settle{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}@keyframes shake{0%,100%{transform:translateX(0)}17%{transform:translateX(-1.6px)}33%{transform:translateX(1.6px)}50%{transform:translateX(-1.1px)}67%{transform:translateX(1.1px)}83%{transform:translateX(-.45px)}}.icon{transform-box:fill-box;transform-origin:center;animation:in 360ms cubic-bezier(.22,1,.36,1) 0ms both}.ring{stroke-dasharray:1 2;animation:draw 480ms cubic-bezier(.65,0,.35,1) 0ms both}.m0{stroke-dasharray:1 2;animation:draw 280ms cubic-bezier(.22,1,.36,1) 360ms both}.wrap{transform-box:fill-box;transform-origin:center;animation:settle 220ms cubic-bezier(.65,0,.35,1) 680ms both}@media (prefers-reduced-motion:reduce){*{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}</style><g class="wrap"><g class="icon"><path class="ring" pathLength="1" d="M12,2 A10,10 0 1,1 12,22 A10,10 0 1,1 12,2" stroke="#8EC3A4" stroke-width="1.5" stroke-linecap="round"/><path class="m0" pathLength="1" d="M8.5,12.5 L10.5,14.5 L15.5,9.5" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>